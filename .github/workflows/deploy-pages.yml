name: Publish Kagome tools
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r docs-requirements.txt
      - run: python build.py
      - run: python scripts/verify_package.py
      - run: python -m pip install numpy scipy pytest
      - run: python -m pytest tests/test_release_rules.py tests/test_effects.py tests/test_admission_contract.py -q
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html app.html usage.html principles.html guide.html demonstration.html specification.html 仕様書.md completion.html 完成確認.md icon.svg engine.zip desktop-tool.zip source-manifest.json browser_adapter.py web-bridge.js worker.mjs sw.js _site/
          cp -r assets _site/
          cp -r docs _site/
          mkdir -p _site/examples/admission
          cp examples/admission/README.md examples/admission/low.json examples/admission/high.json examples/admission/direction-6-off.json _site/examples/admission/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for the uploaded artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          for attempt in range(8):
              with urllib.request.urlopen(request, timeout=15) as response:
                  artifacts = json.load(response)["artifacts"]
              matching = [item for item in artifacts if item["name"] == os.environ["PAGES_ARTIFACT"] and not item["expired"]]
              if len(matching) == 1:
                  print("Pages artifact is visible and unambiguous.")
                  # The deployment action reads the artifact service separately.
                  # Allow its metadata to settle after the REST listing sees it.
                  time.sleep(10)
                  break
              time.sleep(2)
          else:
              raise SystemExit("Pages artifact was not visible after bounded retries.")
          PY
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: python -c "import time; time.sleep(10)"
      - name: Retry deployment once
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
