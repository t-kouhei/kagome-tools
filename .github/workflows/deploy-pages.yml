name: Publish Kagome tools
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r docs-requirements.txt
      - run: python build.py
      - run: python scripts/verify_package.py
      - run: python -m pip install numpy scipy pytest
      - run: python -m pytest tests/test_release_rules.py tests/test_effects.py -q
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html app.html usage.html principles.html guide.html demonstration.html specification.html 仕様書.md icon.svg engine.zip desktop-tool.zip source-manifest.json browser_adapter.py web-bridge.js worker.mjs sw.js _site/
          cp -r assets _site/
          cp -r docs _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
